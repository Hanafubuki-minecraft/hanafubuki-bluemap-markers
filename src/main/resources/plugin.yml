name: HanafubukiBlueMapMarkers
version: '${version}'
main: com.hanafubuki.markers.MarkersPlugin
api-version: '1.21'
author: ByteMe6
website: https://github.com/ByteMe6/hanafubuki-bluemap-markers
description: Let players place their own markers on the BlueMap web map
softdepend: [BlueMap]

commands:
  marker:
    description: Player markers on the BlueMap web map
    usage: /marker <add|remove|list>
    aliases: [markers, метка]

permissions:
  hanafubuki.marker.use:
    description: Create, remove and list own markers
    default: true
  hanafubuki.marker.unlimited:
    description: Ignore the per-player marker limit
    default: op
  hanafubuki.marker.admin:
    description: Remove any marker, change language, reload config
    default: op
    children:
      hanafubuki.marker.use: true
