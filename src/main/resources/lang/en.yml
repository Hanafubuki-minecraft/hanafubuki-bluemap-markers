# Style: https://github.com/Hanafubuki-minecraft/hanafubuki-brand/blob/main/STYLE.md
# Colors: <accent> <text> <muted> <dim> <success> <error> <gold>, symbol: <symbol> — palette in config.yml → style
# English messages for HanafubukiBlueMapMarkers
# Format: MiniMessage — https://docs.advntr.dev/minimessage/format.html
# Missing keys fall back to the built-in English text.

prefix: "<accent><symbol></accent> "

# Shown on the BlueMap web page. map-detail is HTML (not MiniMessage); <name> and <owner> are replaced.
layer-label: "Player markers"
map-detail: "<b><name></b><br><owner>"

players-only: "<error>Only players can use this command."
no-permission: "<error>You don't have permission to do that."

usage-add: "<error>Usage: <text>/<label> add [name]"
usage-remove: "<error>Usage: <text>/<label> remove [name]"
usage-adminremove: "<error>Usage: <text>/<label> adminremove [player] [name]"

add-ok: "<success>Marker <text><name></text> added to the map."
bad-name: "<error>Name must be 1–<max> characters: letters, digits, spaces, - and _."
world-disabled: "<error>Markers can't be placed in this world."
limit: "<error>You've reached the limit of <limit> markers. Remove one first: <text>/<label> remove [name]"
exists: "<error>You already have a marker with that name."

remove-ok: "<success>Marker <text><name></text> removed."
remove-not-found: "<error>No marker with that name. See <text>/<label> list"

list-empty: "<muted>You have no markers yet. Add one: <text>/<label> add [name]"
list-header: "<success>Your markers (<count>/<limit>):"
list-entry: "<muted> • <text><name></text> — <world> <x> <y> <z>"

admin-no-markers: "<error><player> has no markers."
admin-remove-ok: "<success>Removed marker <text><name></text> of <player>."
admin-remove-not-found: "<error><player> has no marker with that name."

language-current: "<muted>Current language: <text><language></text>. Available: <text><available>"
language-set: "<success>Language set to <text><language></text>."
language-unknown: "<error>Unknown language <text><language></text>. Available: <text><available>"
reloaded: "<success>Configuration reloaded."

help-header: "<success>BlueMap markers:"
help-add: "<muted> /<label> add [name] <dim>—</dim> mark your current position"
help-remove: "<muted> /<label> remove [name] <dim>—</dim> remove your marker"
help-list: "<muted> /<label> list <dim>—</dim> your markers"
help-adminremove: "<muted> /<label> adminremove [player] [name] <dim>—</dim> remove any marker"
help-language: "<muted> /<label> language [code] <dim>—</dim> change language"
help-reload: "<muted> /<label> reload <dim>—</dim> reload config"
