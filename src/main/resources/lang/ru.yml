# Style: https://github.com/Hanafubuki-minecraft/hanafubuki-brand/blob/main/STYLE.md
# Colors: <accent> <text> <muted> <dim> <success> <error> <gold>, symbol: <symbol> — palette in config.yml → style
# Русские сообщения HanafubukiBlueMapMarkers
# Формат: MiniMessage — https://docs.advntr.dev/minimessage/format.html
# Если ключа нет, берётся встроенный текст.

prefix: "<accent><symbol></accent> "

# Показывается на веб-странице BlueMap. map-detail — это HTML (не MiniMessage); <name> и <owner> подставляются.
layer-label: "Метки игроков"
map-detail: "<b><name></b><br><owner>"

players-only: "<error>Эта команда только для игроков."
no-permission: "<error>Недостаточно прав."

usage-add: "<error>Использование: <text>/<label> add [название]"
usage-remove: "<error>Использование: <text>/<label> remove [название]"
usage-adminremove: "<error>Использование: <text>/<label> adminremove [игрок] [название]"

add-ok: "<success>Метка <text><name></text> добавлена на карту."
bad-name: "<error>Название: 1–<max> символов — буквы, цифры, пробел, - и _."
world-disabled: "<error>В этом мире метки ставить нельзя."
limit: "<error>Достигнут лимит меток: <limit>. Сначала удали одну: <text>/<label> remove [название]"
exists: "<error>У тебя уже есть метка с таким названием."

remove-ok: "<success>Метка <text><name></text> удалена."
remove-not-found: "<error>Нет метки с таким названием. Список: <text>/<label> list"

list-empty: "<muted>У тебя пока нет меток. Добавить: <text>/<label> add [название]"
list-header: "<success>Твои метки (<count>/<limit>):"
list-entry: "<muted> • <text><name></text> — <world> <x> <y> <z>"

admin-no-markers: "<error>У игрока <player> нет меток."
admin-remove-ok: "<success>Метка <text><name></text> игрока <player> удалена."
admin-remove-not-found: "<error>У игрока <player> нет метки с таким названием."

language-current: "<muted>Текущий язык: <text><language></text>. Доступны: <text><available>"
language-set: "<success>Язык изменён на <text><language></text>."
language-unknown: "<error>Неизвестный язык <text><language></text>. Доступны: <text><available>"
reloaded: "<success>Конфигурация перезагружена."

help-header: "<success>Метки на карте BlueMap:"
help-add: "<muted> /<label> add [название] <dim>—</dim> метка на твоём месте"
help-remove: "<muted> /<label> remove [название] <dim>—</dim> удалить свою метку"
help-list: "<muted> /<label> list <dim>—</dim> твои метки"
help-adminremove: "<muted> /<label> adminremove [игрок] [название] <dim>—</dim> удалить любую метку"
help-language: "<muted> /<label> language [код] <dim>—</dim> сменить язык"
help-reload: "<muted> /<label> reload <dim>—</dim> перезагрузить конфиг"
